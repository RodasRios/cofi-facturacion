services:

  postgres:
    image: postgres:16
    container_name: facturacion_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-facturacion}
      POSTGRES_USER: ${DB_USER:-facturacion_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-facturacion123}
    # Solo accesible desde la propia máquina (para psql/backups), nunca desde internet.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - facturacion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-facturacion_user} -d ${DB_NAME:-facturacion}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/backend_django
      dockerfile: Dockerfile
    container_name: facturacion_backend
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-cambia-esta-clave-en-produccion}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DB_NAME: ${DB_NAME:-facturacion}
      DB_USER: ${DB_USER:-facturacion_user}
      DB_PASSWORD: ${DB_PASSWORD:-facturacion123}
      DB_HOST: postgres
      DB_PORT: "5432"
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      RUN_SEED: ${RUN_SEED:-true}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      COTIZACION_CONSECUTIVO_INICIAL: ${COTIZACION_CONSECUTIVO_INICIAL:-0}
      # Links que van en WhatsApp/correo a las plantas (PDF de la orden).
      PUBLIC_URL: ${PUBLIC_URL:-https://facturacion.cofilatam.com}
      # Correo para avisar a las plantas. Sin EMAIL_HOST, el botón "Correo" queda deshabilitado.
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
    volumes:
      - facturacion_media:/app/media
    # El backend no se publica a internet: nginx del host solo habla con el
    # frontend, y el frontend hace de proxy a /api dentro de la red de Docker.
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: facturacion_frontend
    restart: unless-stopped
    # nginx del host hace de reverse proxy hacia este puerto.
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - backend

volumes:
  facturacion_pgdata:
  facturacion_media:
